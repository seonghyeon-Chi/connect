<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 로그인 코드가 다른 사이트로 새지 않게 -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>계정 연결</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8fb;
        --card: #fff;
        --text: #101828;
        --muted: #5f6a7e;
        --accent: #2a78d6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f17;
          --card: #141a24;
          --text: #eef2f7;
          --muted: #8a94a6;
          --accent: #3987e5;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      }
      main {
        max-width: 420px;
        padding: 28px 24px;
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 6px 20px rgba(16, 24, 40, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 19px;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 14px;
      }
      a[hidden] {
        display: none;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">계정을 연결하고 있습니다</h1>
      <p id="message">잠시만 기다려 주세요.</p>
      <a id="back" href="#" hidden>연결 화면으로 돌아가기</a>
    </main>
    <script>
      /*
       * 계정 연결 중계 — 삼성(SmartThings) 로그인은 https 주소로만 돌아올 수 있어, 이 페이지가 받아
       * 연결을 시작한 사내 화면으로 로그인 코드를 그대로 넘깁니다. 코드는 서버의 비밀 키 없이는 쓸 수 없고,
       * 이 페이지는 아무것도 저장하거나 다른 곳으로 보내지 않습니다.
       * 돌아갈 주소는 연결을 시작할 때 state 에 담아 보내며, 사내망 주소(사설 IP · localhost · .local)일 때만 이동합니다.
       */
      ;(function () {
        var params = new URLSearchParams(location.search)
        var code = params.get('code')
        var state = params.get('state') || ''
        var error = params.get('error')

        function show(title, message) {
          document.getElementById('title').textContent = title
          document.getElementById('message').textContent = message
        }

        // state = <임의 값>.<돌아갈 주소(base64url)>
        var origin = null
        try {
          var part = state.split('.')[1] || ''
          var b64 = part.replace(/-/g, '+').replace(/_/g, '/')
          while (b64.length % 4) b64 += '='
          origin = atob(b64)
        } catch (e) {
          origin = null
        }

        function isInternal(value) {
          try {
            var u = new URL(value)
            if (u.protocol !== 'http:' && u.protocol !== 'https:') return false
            if (u.origin !== value) return false
            var h = u.hostname
            return (
              h === 'localhost' ||
              h === '127.0.0.1' ||
              /^10\.\d+\.\d+\.\d+$/.test(h) ||
              /^192\.168\.\d+\.\d+$/.test(h) ||
              /^172\.(1[6-9]|2\d|3[01])\.\d+\.\d+$/.test(h) ||
              /\.local$/.test(h)
            )
          } catch (e) {
            return false
          }
        }

        if (!origin || !isInternal(origin)) {
          show('연결을 이어 갈 수 없습니다', '사내 화면의 "기기 연결"에서 다시 시작해 주세요.')
          return
        }

        var back = new URLSearchParams()
        back.set('st_state', state)
        if (code) back.set('st_code', code)
        else back.set('st_error', error || 'no_code')
        var target = origin + '/devices/connect?' + back.toString()

        show('연결 화면으로 돌아갑니다', '자동으로 이동하지 않으면 아래를 눌러 주세요.')
        var link = document.getElementById('back')
        link.href = target
        link.hidden = false
        // 뒤로 가기로 이 페이지(코드가 담긴 주소)에 다시 오지 않게 replace
        location.replace(target)
      })()
    </script>
  </body>
</html>
